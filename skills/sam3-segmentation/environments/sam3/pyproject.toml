[project]
name = "sam3-segmentation-model"
version = "0.1.1"
description = "Isolated, pinned SAM 3 image inference environment for Linux NVIDIA systems"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.10.0", "torchvision==0.25.0",
  "sam3 @ git+https://github.com/facebookresearch/sam3.git@0570b3a5be9c4e694f23d85232fb55f4a6f1f7fc",
  "numpy>=1.26,<2", "scipy>=1.15,<2", "pillow>=11,<13",
  "opencv-python-headless", "huggingface_hub", "einops",
  "pycocotools==2.0.11", "psutil", "setuptools<81", "filelock>=3.19,<4"
]

[tool.uv]
package = false
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

# Preserve the tested x86-64 runtime; use CUDA 13.0 on ARM64 (e.g. GB10).
[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "platform_machine == 'x86_64'" },
  { index = "pytorch-cu130", marker = "platform_machine == 'aarch64'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "platform_machine == 'x86_64'" },
  { index = "pytorch-cu130", marker = "platform_machine == 'aarch64'" },
]
